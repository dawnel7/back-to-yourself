<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ec">
  <meta name="description" content="Back To Yourself — a gentle place to notice, listen, and return to yourself.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <title>Back To Yourself</title>
</head>
<body>
  <header class="topbar">
    <button class="brand" aria-label="Back To Yourself home">
      <img src="icon.png" alt="" class="brand-icon">
      <span>Back To Yourself</span>
    </button>
  </header>
  <main id="app"></main>
  <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation">
    <button data-view="home"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 3.8l8.5 6.7"/><path d="M5.5 9.8v9.2h13V9.8"/><path d="M9.5 19v-5.2h5V19"/></svg></span><small>Today</small></button>
    <button data-view="journal"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 4.5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16l-5.5-3.5-5.5 3.5z"/></svg></span><small>Journal</small></button>
    <button data-view="tools"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20.2S4.2 15.7 3.7 9.7C3.4 6.1 5.8 3.7 9 3.7c1.6 0 2.5.7 3 1.7.5-1 1.4-1.7 3-1.7 3.2 0 5.6 2.4 5.3 6-.5 6-8.3 10.5-8.3 10.5z"/></svg></span><small>Tools</small></button>
    <button data-view="more"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span><small>More</small></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4eee8">
  <meta name="description" content="Back To Yourself — a gentle place to notice, listen, and return to yourself.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Back To Yourself</title>
</head>
<body>
  <header class="topbar">
    <button class="brand" data-view="home" aria-label="Back To Yourself home">
      <span class="leaf">◌</span>
      <span>Back To Yourself</span>
    </button>
    <button id="menuBtn" class="icon-btn" aria-label="Open menu">☰</button>
  </header>

  <main id="app"></main>

  <nav id="bottomNav" class="bottom-nav" aria-label="Main navigation">
    <button data-view="home"><span>⌂</span><small>Today</small></button>
    <button data-view="journal"><span>☷</span><small>Journal</small></button>
    <button data-view="journey"><span>♡</span><small>Journey</small></button>
    <button data-view="settings"><span>⚙</span><small>More</small></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
